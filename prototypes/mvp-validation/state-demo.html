<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herdr Action 계약</title><style>body{font:16px/1.7 system-ui;margin:48px auto;max-width:920px;padding:0 24px;color:#18302b;background:#f5f7f4}h1{font-size:32px}section{background:white;border:1px solid #d9e3df;border-radius:12px;padding:24px;margin:24px 0}dl{display:grid;grid-template-columns:170px 1fr}dt{color:#526760}dd{margin:0;font-weight:600}button{font:inherit;padding:9px 14px;margin:4px;border:1px solid #a6bdb4;border-radius:7px;background:white;cursor:pointer}button[aria-selected=true]{background:#166653;color:white}#notice{padding:16px;background:#edf5ef}small{color:#526760}</style><h1>Herdr Action은 어디까지 확인됐을까요?</h1><p>제출·완료 관찰을 분리하면 응답 유실, 중복 호출, 세션 변경을 어떻게 다루는지 눌러보세요. 이 demo는 상태 계약이며 실제 pane을 조작하지 않습니다.</p><section><h2>현재 상태</h2><dl id="state"></dl><p id="notice"></p></section><section><h2>자유롭게 눌러보기</h2><div id="free"></div><button id="reset">처음으로</button></section><section><h2>사례별 따라가기</h2><div id="tabs" role="tablist"></div><p id="description"></p><div id="steps"></div></section><small>종료 표식은 terminal 출력에 대한 관찰입니다. 악의적인 출력은 표식을 위조할 수 있고, 이 상태 모델은 실제 실행의 진위를 증명하지 않습니다.</small><script>() => ({ submission: 'not_submitted', observation: 'not_started', attempts: 0, held: false, session: 1, proposalSession: 1, message: '제안이 준비됐습니다.' });function transition(state, event) {
  const s = { ...state };
  if (event === 'submit') {
    if (s.attempts || s.held || s.session !== s.proposalSession) return { ...s, message: '제출을 보류했습니다. 기존 receipt를 확인하거나 새 대상에 제안을 다시 만드세요.' };
    return { ...s, submission: 'dispatching', observation: 'observing', attempts: 1, held: true, message: '전송 의도를 기록했습니다. 이 제안은 다시 보내지 않습니다.' };
  }
  if (event === 'ack' && s.submission === 'dispatching') return { ...s, submission: 'accepted', message: 'Herdr가 입력을 받았습니다. 종료 결과는 아직 모릅니다.' };
  if (event === 'lost' && s.attempts) return { ...s, submission: 'unknown', held: true, message: '응답이 유실됐습니다. 자동 재전송하지 않습니다.' };
  if (event === 'complete' && s.attempts) return { ...s, observation: 'completion_observed', held: false, message: '현재 Action의 종료 표식을 관찰했습니다. 출력의 주장이며 신뢰된 실행 증명은 아닙니다.' };
  if (event === 'timeout' && s.attempts) return { ...s, observation: 'outcome_unknown', held: true, message: '종료 여부를 확인하지 못했습니다. 다음 일반 입력을 보류합니다.' };
  if (event === 'cancel') return { ...s, message: '후속 작업을 취소했습니다. 이미 전송된 명령은 별도 interrupt가 필요합니다.' };
  if (event === 'restart' && s.submission === 'dispatching') return { ...s, submission: 'unknown', held: true, message: '재시작 전의 전송 의도를 복구했습니다. 실행 여부를 추정하지 않습니다.' };
  if (event === 'session') return { ...s, session: s.session + 1, held: true, message: 'Pane Session이 바뀌었습니다. 기존 제안과 승인을 무효화합니다.' };
  return { ...s, message: '현재 상태에서는 이 사건으로 상태가 바뀌지 않습니다.' };
};const actions={"submit":"제출 시도","ack":"Herdr 입력 수락","lost":"응답 유실","complete":"종료 표식 관찰","timeout":"관찰 기한 경과","cancel":"작업 취소","restart":"Broker 재시작","session":"Pane Session 변경"},scenarios=[{"title":"정상 종료","text":"입력 수락과 종료 관찰이 별개의 단계인지 확인하세요.","steps":["submit","ack","complete"]},{"title":"응답 유실","text":"수락 응답이 없어도 종료는 관찰할 수 있습니다. 같은 제안은 다시 전송하지 않습니다.","steps":["submit","lost","submit","complete"]},{"title":"재시작","text":"전송 의도만 남은 경우 새 Broker가 입력을 재생하면 중복 실행할 수 있습니다.","steps":["submit","restart","submit"]},{"title":"대상 변경","text":"같은 pane 주소라도 새 실행 문맥에는 기존 제안이 유효하지 않습니다.","steps":["session","submit"]},{"title":"결과 불명","text":"입력 수락 이후 출력이 끊기면 다음 일반 명령을 보류합니다.","steps":["submit","ack","timeout","submit"]}];let state=initial(),active=0,step=0;const labels={not_submitted:'미제출',dispatching:'전송 시도 중',accepted:'입력 수락',unknown:'접수 불명',not_started:'관찰 전',observing:'관찰 중',completion_observed:'종료 표식 관찰',outcome_unknown:'결과 불명'};function render(){document.getElementById('state').innerHTML=[['입력 제출',labels[state.submission]],['결과 관찰',labels[state.observation]],['제출 시도',state.attempts+'회'],['다음 일반 입력',state.held?'보류':'보류 없음'],['현재 세션',state.session],['제안의 세션',state.proposalSession]].map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('');document.getElementById('notice').textContent=state.message;}function dispatch(event){state=transition(state,event);render();}for(const [key,title] of Object.entries(actions)){const b=document.createElement('button');b.textContent=title;b.onclick=()=>dispatch(key);document.getElementById('free').append(b);}document.getElementById('reset').onclick=()=>{state=initial();render();};function choose(i){active=i;step=0;state=initial();render();document.getElementById('description').textContent=scenarios[i].text;document.querySelectorAll('[role=tab]').forEach((b,j)=>b.setAttribute('aria-selected',i===j));document.getElementById('steps').replaceChildren();scenarios[i].steps.forEach((event,n)=>{const b=document.createElement('button');b.textContent=(n+1)+'. '+actions[event];b.onclick=()=>{if(n!==step)return;dispatch(event);step++;b.disabled=true;};document.getElementById('steps').append(b);});}scenarios.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title;b.setAttribute('role','tab');b.onclick=()=>choose(i);document.getElementById('tabs').append(b);});choose(0);</script></html>
